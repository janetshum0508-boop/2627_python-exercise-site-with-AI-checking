    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Python Teaching Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            background: #F7F4EF;
            color: #1F2421;
            line-height: 1.6;
        }

        nav {
            position: sticky;
            top: 0;

            padding: 1.2rem 2rem;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            font-family: 'Fraunces', serif;
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: -0.02em;
        }

        nav h1 em {
            color: #C4612F;
            font-style: italic;
        }

        .nav-status {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 400;
        }

        .chip-success {
            background: #E8F5E9;
            color: #2E7D32;
        }

        .chip-warning {
            background: #FFF9E6;
            color: #F57C00;
        }

        .chip-error {
            background: #FFEBEE;
            color: #C62828;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }
